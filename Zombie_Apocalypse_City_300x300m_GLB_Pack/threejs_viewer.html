<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Zombie Apocalypse City (300x300m) - Three.js Viewer</title>
<style>
  body { margin: 0; overflow: hidden; background: #1c1f22; font-family: system-ui, sans-serif; color: #ddd; }
  #hud { position: absolute; top: 12px; left: 12px; background: rgba(18,20,22,0.82); padding: 10px 14px; border-radius: 8px; font-size: 13px; border: 1px solid #3a3f44; }
  #hud b { color: #f59e0b; }
</style>
</head>
<body>
<div id="hud">
  <b>Zombie Apocalypse City (300m x 300m)</b><br/>
  Drag: Orbit &nbsp;|&nbsp; Right-Drag: Pan &nbsp;|&nbsp; Scroll: Zoom<br/>
  <span id="status">Loading Zombie_Apocalypse_City_Complete.glb...</span>
</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.168.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.168.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x52575c);
scene.fog = new THREE.FogExp2(0x4c5156, 0.0052);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.3, 450);
camera.position.set(-55, 42, 62);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 6, 0);
controls.maxPolarAngle = Math.PI * 0.49;
controls.update();

// Overcast dusty apocalyptic lighting (lightweight 2-light setup)
const hemi = new THREE.HemisphereLight(0x9ea7b0, 0x3b352e, 1.15);
scene.add(hemi);

const dir = new THREE.DirectionalLight(0xffdfc2, 1.8);
dir.position.set(-85, 110, 60);
dir.castShadow = true;
dir.shadow.mapSize.set(2048, 2048);
dir.shadow.camera.near = 10;
dir.shadow.camera.far = 360;
dir.shadow.camera.left = dir.shadow.camera.bottom = -160;
dir.shadow.camera.right = dir.shadow.camera.top = 160;
dir.shadow.bias = -0.0005;
scene.add(dir);

const loader = new GLTFLoader();
loader.load('./Zombie_Apocalypse_City_Complete.glb', (gltf) => {
  gltf.scene.traverse((obj) => {
    if (obj.isMesh) {
      const isFX = obj.material.name === 'fire_fx' || obj.material.name === 'smoke_fx';
      obj.castShadow = !isFX;
      obj.receiveShadow = !isFX;
      if (isFX) obj.material.depthWrite = false;
    }
  });
  scene.add(gltf.scene);
  const colliders = gltf.scene.userData.colliders || [];
  document.getElementById('status').textContent = `Loaded! Colliders in userData: ${colliders.length}`;
}, undefined, (err) => {
  document.getElementById('status').textContent = 'Run via local HTTP server (e.g. python -m http.server) to load .glb';
  console.error(err);
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
animate();
</script>
</body>
</html>
