<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fruit Block Blast</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--gw:min(94vw,430px);--bs:min(94vw,52vh,390px);--tc:clamp(17px,5.2vw,25px);--wd:#7a4a22;--wl:#e0b27a;--cr:#fff4d0}
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0}
body{background:#87ceeb;color:#5a3519;font-family:'Baloo 2',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));overflow:hidden;touch-action:none;position:relative}
button{font:inherit;border:0;color:#fff;cursor:pointer}

/* ============================================================
   🌳 LIVING FRUIT GARDEN — BACKGROUND SYSTEM
   ============================================================ */
#garden{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}

/* ---- Sky ---- */
.g-sky{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 80% 40% at 88% 8%,rgba(255,240,180,.55) 0%,transparent 60%),
    linear-gradient(180deg,
      #4fb3ec 0%, #6ec2ee 15%, #8fd2f0 30%,
      #b8e2ef 45%, #dceccd 58%, #eef0b8 68%,
      #d4e893 76%, #b6dd78 84%, #93cf5c 92%, #7cc24a 100%);
}

/* ---- Sun ---- */
.g-sun{
  position:absolute;top:-100px;right:-100px;
  width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle,
    #fffef0 0%, #fff5a8 20%, #ffe066 38%, #ffc533 52%, rgba(255,190,60,0) 72%);
  filter:blur(1px);
}
.g-sun::before{
  content:'';position:absolute;inset:-90px;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,244,160,.45) 0 4deg,transparent 4deg 20deg);
  -webkit-mask:radial-gradient(circle,#000 10%,transparent 58%);
  mask:radial-gradient(circle,#000 10%,transparent 58%);
  animation:sunSpin 100s linear infinite;
}
@keyframes sunSpin{to{transform:rotate(360deg)}}

/* ---- Clouds ---- */
.g-clouds{position:absolute;inset:0}
.g-cloud{
  position:absolute;height:22px;background:#fff;border-radius:999px;
  opacity:.9;filter:blur(.4px);will-change:transform;
  animation:cloudDrift linear infinite;
}
.g-cloud::before,.g-cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.g-cloud::before{width:34px;height:34px;left:10%;top:-16px}
.g-cloud::after{width:24px;height:24px;right:12%;top:-12px}
@keyframes cloudDrift{
  from{transform:translateX(-40vw)}
  to{transform:translateX(140vw)}
}

/* ---- Hills ---- */
.g-hills{position:absolute;inset:0}
.g-hill{position:absolute;border-radius:50%;pointer-events:none}
.g-hill.h-far-1{left:-30%;bottom:14vh;width:110vw;height:55vh;background:radial-gradient(circle at 50% 30%,#b8e07a,#93c95a 70%)}
.g-hill.h-far-2{right:-40%;bottom:13vh;width:120vw;height:60vh;background:radial-gradient(circle at 50% 30%,#a5d968,#7cbb48 70%)}
.g-hill.h-mid-1{left:-20%;bottom:8vh;width:100vw;height:50vh;background:radial-gradient(circle at 50% 30%,#8ed053,#5fa832 72%)}
.g-hill.h-mid-2{right:-25%;bottom:6vh;width:105vw;height:52vh;background:radial-gradient(circle at 50% 30%,#7fc848,#4e9a2a 72%)}

/* ---- Fence (wooden) ---- */
.g-fence{position:absolute;left:0;right:0;bottom:14vh;height:80px;pointer-events:none;opacity:.95}
.g-fence svg{width:100%;height:100%;display:block}

/* ---- Foreground ground strip ---- */
.g-ground{
  position:absolute;left:0;right:0;bottom:0;height:18vh;
  background:linear-gradient(180deg,#67b837 0%,#4ea028 40%,#3d8a1e 100%);
}
.g-ground::before{
  content:'';position:absolute;top:-8px;left:0;right:0;height:20px;
  background:radial-gradient(ellipse 100% 100% at 50% 100%,rgba(120,200,80,.6) 0%,transparent 70%);
}

/* ---- Trees — NOW AFTER GROUND IN DOM ---- */
.g-trees{position:absolute;inset:0;pointer-events:none}
.g-tree{
  position:absolute;pointer-events:none;
  transform-origin:bottom center;
  will-change:transform;
}
.g-tree .tree-sway{
  animation:treeSway ease-in-out infinite alternate;
  transform-origin:bottom center;
  display:block;width:100%;height:100%;
}
.g-tree svg{display:block;width:100%;height:100%;overflow:visible}
@keyframes treeSway{
  0%{transform:rotate(-1.6deg)}
  100%{transform:rotate(1.6deg)}
}

/* ---- Bushes ---- */
.g-bushes{position:absolute;inset:0;pointer-events:none}
.g-bush{
  position:absolute;pointer-events:none;
  background:radial-gradient(ellipse at 50% 100%,#5fb83a 0%,#3f9a22 55%,#2a6b12 100%);
  border-radius:50% 50% 0 0 / 100% 100% 0 0;
  transform-origin:bottom center;
  animation:bushSway ease-in-out infinite alternate;
}
.g-bush::after{
  content:'';position:absolute;left:20%;top:15%;width:35%;height:35%;
  background:radial-gradient(circle,rgba(160,230,120,.6),transparent 70%);
  border-radius:50%;
}
@keyframes bushSway{
  0%{transform:rotate(-1.2deg) scaleY(1)}
  100%{transform:rotate(1.2deg) scaleY(1.02)}
}

/* ---- Grass blades ---- */
.g-grass{position:absolute;left:0;right:0;bottom:0;height:20vh;pointer-events:none}
.blade{
  position:absolute;bottom:0;width:3px;
  background:linear-gradient(to top,#2f7a16,#66bb6a 60%,#88d16a);
  border-radius:3px 3px 0 0;
  transform-origin:bottom center;
  animation:bladeSway ease-in-out infinite alternate;
  will-change:transform;
}
@keyframes bladeSway{
  0%{transform:rotate(-7deg) scaleY(1)}
  100%{transform:rotate(7deg) scaleY(1.05)}
}

/* ---- Flowers ---- */
.g-flowers{position:absolute;left:0;right:0;bottom:0;height:22vh;pointer-events:none}
.flower{
  position:absolute;line-height:1;
  transform-origin:bottom center;
  animation:flowerSway ease-in-out infinite alternate;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.15));
  will-change:transform;
}
.flower::after{
  content:'';position:absolute;left:50%;bottom:-4px;width:2px;height:10px;
  background:#3f8a1c;transform:translateX(-50%);border-radius:2px;
}
@keyframes flowerSway{
  0%{transform:rotate(-5deg)}
  100%{transform:rotate(6deg)}
}

/* ---- Animals ---- */
.g-animals{position:absolute;inset:0;pointer-events:none}

.butterfly{
  position:absolute;left:0;top:0;width:32px;height:26px;
  will-change:transform;pointer-events:none;
  filter:drop-shadow(0 4px 4px rgba(0,0,0,.2));
}
.butterfly svg{width:100%;height:100%;overflow:visible}
.bwing{transform-box:fill-box;animation:wingFlap .14s ease-in-out infinite alternate}
.bwing.bl{transform-origin:100% 50%}
.bwing.br{transform-origin:0% 50%;animation-direction:alternate-reverse}
@keyframes wingFlap{0%{transform:scaleX(1)}100%{transform:scaleX(.35)}}

.bee{
  position:absolute;left:0;top:0;font-size:20px;line-height:1;
  will-change:transform;pointer-events:none;
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.25));
}
.bee span{display:inline-block;animation:beeBob .28s ease-in-out infinite alternate}
@keyframes beeBob{to{transform:translateY(-2px) rotate(-8deg)}}

.bird{
  position:absolute;font-size:20px;line-height:1;pointer-events:none;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));
  transform-origin:center bottom;
}
.bird.perched{animation:birdPeck 3.5s ease-in-out infinite}
@keyframes birdPeck{
  0%,70%,100%{transform:rotate(0)}
  78%{transform:rotate(-18deg) translateY(2px)}
  86%{transform:rotate(0)}
}
.bird.flying{animation:birdFly var(--dur,18s) linear infinite}
@keyframes birdFly{
  0%{transform:translate3d(-8vw,0,0) scaleX(-1)}
  50%{transform:translate3d(50vw,-10vh,0) scaleX(-1)}
  100%{transform:translate3d(112vw,4vh,0) scaleX(-1)}
}

.mouse{
  position:absolute;font-size:22px;line-height:1;pointer-events:none;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));
  animation:mouseRun var(--dur,12s) linear;
}
@keyframes mouseRun{
  0%{transform:translate3d(-60px,0,0) scaleX(1)}
  45%{transform:translate3d(45vw,-4px,0) scaleX(1)}
  50%{transform:translate3d(45vw,-4px,0) scaleX(1) rotate(-4deg)}
  55%{transform:translate3d(46vw,-6px,0) scaleX(-1) rotate(0)}
  100%{transform:translate3d(115vw,-6px,0) scaleX(-1)}
}

.rabbit{
  position:absolute;font-size:30px;line-height:1;pointer-events:none;
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.25));
  transform-origin:center bottom;
}
.rabbit.hop{animation:rabbitHop var(--dur,10s) linear infinite}
@keyframes rabbitHop{
  0%{transform:translate3d(-40px,0,0) scaleX(1)}
  15%{transform:translate3d(10vw,-24px,0) scaleX(1) rotate(-6deg)}
  30%{transform:translate3d(20vw,0,0) scaleX(1)}
  40%{transform:translate3d(26vw,0,0) scaleX(1)}
  42%{transform:translate3d(26vw,0,0) scaleX(1) rotate(0)}
  55%{transform:translate3d(36vw,-22px,0) scaleX(1) rotate(-6deg)}
  70%{transform:translate3d(48vw,0,0) scaleX(-1)}
  100%{transform:translate3d(115vw,-6px,0) scaleX(-1)}
}

/* ---- Pollen particles ---- */
.g-pollen{position:absolute;inset:0;pointer-events:none}
.pollen{
  position:absolute;width:5px;height:5px;border-radius:50%;
  background:radial-gradient(#fff8c4,#ffe066);
  box-shadow:0 0 6px rgba(255,224,102,.9);
  opacity:0;will-change:transform,opacity;
  animation:pollenFloat linear infinite;
}
@keyframes pollenFloat{
  0%{opacity:0;transform:translate3d(0,0,0)}
  10%{opacity:.85}
  85%{opacity:.85}
  100%{opacity:0;transform:translate3d(30px,-140px,0)}
}

/* ---- Warm sunlight overlay ---- */
.g-sunlight{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 55% 40% at 88% 6%,rgba(255,238,160,.35) 0%,transparent 65%),
    radial-gradient(ellipse 45% 55% at 6% 96%,rgba(180,230,140,.18) 0%,transparent 60%);
  mix-blend-mode:soft-light;
}

/* ===== TOMBOL FLOATING KEMBALI KE DUNIA 3D ===== */
#back-to-world{
  position:fixed;
  top:max(12px,env(safe-area-inset-top));
  left:max(12px,env(safe-area-inset-left));
  z-index:500;
  padding:10px 18px;
  font-size:15px;font-weight:800;color:#fff;
  background:linear-gradient(#6ec6ff,#1971c2);
  border:3px solid #fff;border-radius:99px;
  box-shadow:0 5px 0 #0d3a6b,0 10px 20px rgba(0,0,0,.35);
  text-shadow:0 2px 0 rgba(0,0,0,.3);
  display:flex;align-items:center;gap:6px;
  animation:backPulse 2.5s ease-in-out infinite;
  transition:transform .12s;
}
#back-to-world:active{transform:translateY(3px);box-shadow:0 2px 0 #0d3a6b}
@keyframes backPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#back-to-world .lbl{display:inline}
@media(max-width:380px){
  #back-to-world{padding:8px 14px;font-size:13px}
  #back-to-world .lbl{display:none}
}

/* ===== TOMBOL FLOATING MUSIK ALAM ===== */
#music-btn{
  position:fixed;
  top:max(12px,env(safe-area-inset-top));
  right:max(12px,env(safe-area-inset-right));
  z-index:500;
  padding:10px 18px;
  font-size:15px;font-weight:800;color:#fff;
  background:linear-gradient(#68d391,#2f855a);
  border:3px solid #fff;border-radius:99px;
  box-shadow:0 5px 0 #1c4d34,0 10px 20px rgba(0,0,0,.35);
  text-shadow:0 2px 0 rgba(0,0,0,.3);
  display:flex;align-items:center;gap:6px;
  cursor:pointer;
  transition:transform .12s,background .2s,box-shadow .2s,opacity .2s;
  animation:musicPulse 2.8s ease-in-out infinite;
}
#music-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1c4d34}
#music-btn.muted{
  background:linear-gradient(#a0aec0,#4a5568);
  box-shadow:0 5px 0 #2d3748,0 8px 16px rgba(0,0,0,.25);
  animation:none;
  opacity:0.88;
}
#music-btn.muted:active{box-shadow:0 2px 0 #2d3748}
@keyframes musicPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
#music-btn .lbl{display:inline}
@media(max-width:480px){
  #music-btn{padding:8px 14px;font-size:13px}
  #music-btn .lbl{display:none}
}

.screen{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:1}
#screen-game{width:var(--gw)}

/* panel kertas & kayu */
.box,.ob{width:min(90vw,410px);padding:30px 24px 26px;text-align:center;background:linear-gradient(#fffaf0,#ffeab8);border:5px solid #b7773a;border-radius:30px;box-shadow:0 9px 0 var(--wd),0 26px 40px rgba(70,40,10,.3);animation:bi .45s cubic-bezier(.175,.885,.32,1.275)}
@keyframes bi{from{opacity:0;transform:scale(.7)}}
@keyframes fade{from{opacity:0}}
.mf{display:flex;justify-content:center;gap:6px;font-size:34px;margin-bottom:4px}
.mf span{animation:hop 1.4s ease-in-out infinite}
.mf span:nth-child(2){animation-delay:.15s}.mf span:nth-child(3){animation-delay:.3s}.mf span:nth-child(4){animation-delay:.45s}.mf span:nth-child(5){animation-delay:.6s}
@keyframes hop{50%{transform:translateY(-9px) rotate(8deg)}}
.ttl{font-size:clamp(36px,10vw,50px);line-height:.95;font-weight:800;margin:0 0 8px;color:#e8590c;text-shadow:0 3px 0 #fff,0 6px 0 rgba(122,74,34,.3)}
.sub{font-size:15px;font-weight:600;color:#8a5a2b;margin:0 0 20px}
.btn{width:100%;border-radius:18px;transition:transform .12s,box-shadow .12s;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(4px)}
.main{padding:10px 22px;font-size:22px;font-weight:800;background:linear-gradient(#92e552,#48aa26);box-shadow:0 6px 0 #2c7414,0 12px 18px rgba(0,0,0,.2);animation:pulse 2s ease-in-out infinite}
.main:active{box-shadow:0 2px 0 #2c7414}
@keyframes pulse{50%{transform:scale(1.03)}}
.sec{padding:8px 20px;font-size:17px;font-weight:700;background:linear-gradient(#e6b982,#c68a4a);box-shadow:0 5px 0 #8a5a2b;margin-top:12px;color:#4a2a10;text-shadow:none}
.rst{padding:8px 20px;font-size:17px;font-weight:700;background:linear-gradient(#ff8a65,#e8452c);box-shadow:0 5px 0 #a02a14;margin-top:12px}
.world{padding:8px 20px;font-size:17px;font-weight:700;background:linear-gradient(#6ec6ff,#1971c2);box-shadow:0 5px 0 #0d3a6b;margin-top:12px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
#level-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}
.lv{aspect-ratio:1;border-radius:50%;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;animation:pop .4s both}
.lv.on{background:radial-gradient(#ffe27a,#ffa41c);border:3px solid #fff4d0;color:#5a2d00;box-shadow:0 5px 0 #b86b00}
.lv.on:active{transform:translateY(3px)}
.lv.off{background:#e3d4b0;color:#a99467;cursor:not-allowed;box-shadow:0 4px 0 #c9b88f}
@keyframes pop{from{opacity:0;transform:scale(.6)}}

/* layar game */
#screen-game>h1{margin:0 0 6px;font-size:clamp(24px,6.4vw,32px);line-height:1;font-weight:800;color:#fff;text-shadow:0 3px 0 #3a8a1c,0 6px 10px rgba(0,0,0,.25)}
#status{width:100%;display:grid;grid-template-columns:1fr 1.25fr 1fr auto;align-items:center;gap:5px;padding:6px;margin-bottom:8px;background:linear-gradient(#d9a566,#b97a3c);border:3px solid var(--wd);border-radius:20px;box-shadow:0 5px 0 #5e3718,0 12px 18px rgba(0,0,0,.2)}
.si{display:flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap;font-size:clamp(11px,3vw,14px);font-weight:700;background:var(--cr);border-radius:12px;padding:3px;box-shadow:inset 0 2px 3px rgba(0,0,0,.15)}
.si b{font-size:clamp(16px,4.4vw,21px);font-weight:800;line-height:1.2}
#score-val{color:#2f9e44}#level-val{color:#e8590c}#time-val{color:#1971c2}
.tg{color:#a1887f;font-size:clamp(10px,2.7vw,12px)}
.pause{width:36px;height:36px;border-radius:50%;background:var(--wl);border:2px solid var(--wd);box-shadow:0 3px 0 #5e3718;padding:0}
.tw{color:#e03131!important;animation:pt .5s infinite alternate}
@keyframes pt{to{transform:scale(1.25)}}
.pus{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.pu{padding:5px 8px;border-radius:16px;border:3px solid #fff4d0;font-size:clamp(14px,3.8vw,17px);font-weight:800;display:flex;align-items:center;justify-content:center;gap:7px;text-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .12s}
.pu.b{background:linear-gradient(#ff9a5c,#e8452c);box-shadow:0 5px 0 #a02a14}
.pu.g{background:linear-gradient(#86d96a,#2f9e44);box-shadow:0 5px 0 #1d6b2c}
.pu i{font-style:normal;font-size:1.4em;line-height:1}
.pu em{font-style:normal;min-width:24px;padding:0 7px;border-radius:99px;background:#fff4d0;color:#5a3519;text-shadow:none}
.pu:active:not(.off){transform:translateY(3px)}
.pu.act{border-color:#ffe066;animation:pp .6s infinite alternate}
@keyframes pp{to{box-shadow:0 5px 0 #a02a14,0 0 22px #ffe066}}
.pu.off{background:#cdbf9f!important;color:#8f7f5c;box-shadow:0 4px 0 #a99467!important;cursor:not-allowed;text-shadow:none;border-color:#e3d4b0}
#board{width:var(--bs);height:var(--bs);flex:none;display:grid;grid-template:repeat(8,minmax(0,1fr))/repeat(8,minmax(0,1fr));gap:clamp(2px,.8vw,4px);padding:clamp(5px,1.4vw,9px);background:linear-gradient(145deg,#dca463,#b97a3c);border:4px solid var(--wd);border-radius:20px;box-shadow:0 8px 0 #5e3718,0 20px 30px rgba(60,40,10,.35)}
.cell,.sx{display:flex;align-items:center;justify-content:center;line-height:1;min-width:0;min-height:0}
.cell{background:linear-gradient(160deg,#8d5c34,#6b4122);border-radius:clamp(5px,1.3vw,9px);box-shadow:inset 0 3px 5px rgba(0,0,0,.4),inset 0 -2px 0 rgba(255,255,255,.1);font-size:calc(var(--bs)/8*.72);transition:transform .15s}
.sx{width:var(--tc);height:var(--tc);font-size:calc(var(--tc)*.82)}
.c1::after{content:'🍎';--g:#ff4d4d}.c2::after{content:'🍌';--g:#ffd700}.c3::after{content:'🍇';--g:#b266d9}.c4::after{content:'🍊';--g:#ff9f43}.c5::after{content:'🍉';--g:#2ed573}
.filled::after{filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.cell.filled,.sx.filled{background:linear-gradient(145deg,#fff8dc,#ecd79c);box-shadow:inset 0 -3px 0 rgba(150,110,40,.25),0 2px 3px rgba(0,0,0,.25)}
.sx.filled{border-radius:6px}
.cell.filled::after{animation:settle .3s ease-out}
@keyframes settle{0%{transform:scale(.4)}60%{transform:scale(1.2)}}
.cell.gh{opacity:.6;transform:scale(.92);background:#a8d86a}
.cell.bad{background:rgba(255,60,60,.55)}
.cell.bt{background:rgba(255,90,40,.6);box-shadow:0 0 14px #ff5a2a;transform:scale(.92)}
#tray{width:100%;height:clamp(82px,12vh,104px);margin-top:12px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(#f3d9a4,#e2b977);border:3px solid var(--wd);border-radius:22px;box-shadow:inset 0 3px 8px rgba(90,53,25,.3),0 5px 0 #5e3718}
.sc{flex:1 1 0;min-width:0;display:grid;width:fit-content;margin:0 auto;gap:2px;padding:6px;cursor:grab;touch-action:none}
.sc.dragging{position:fixed;z-index:9999;pointer-events:none;transform:scale(1.15);width:max-content;flex:none;margin:0;filter:drop-shadow(0 16px 10px rgba(0,0,0,.4))}
.ff,.jc,.mis,.zone,.ring,.boom,.gsp,.cf,.ftx,.fsc{position:fixed;pointer-events:none}
.ff{z-index:120;display:flex;align-items:center;justify-content:center;line-height:1;filter:drop-shadow(0 4px 4px rgba(0,0,0,.4))}
.jc{z-index:121;border-radius:50%}
.fsc{font-size:24px;font-weight:800;color:#fff;-webkit-text-stroke:1px #2f7a16;text-shadow:0 2px 0 #2f9e44;z-index:250;animation:sp .8s ease-out forwards}
@keyframes sp{to{opacity:0;transform:translateY(-40px) scale(1.5)}}
.ftx{top:38%;left:50%;font-size:clamp(42px,12vw,60px);font-weight:800;color:#ffe066;-webkit-text-stroke:2px #c2410c;text-shadow:0 5px 0 #c2410c,0 0 24px #fff;z-index:300;animation:fu 1.5s cubic-bezier(.175,.885,.32,1.275) forwards}

<script>
/* ============================================================
   AUDIO & MUSIK ALAM (NATURE VIBE SOUNDSCAPE)
   ============================================================ */
const AC=new(window.AudioContext||window.webkitAudioContext)();
const tone=(f,t,d,v=.1)=>{if(AC.state==='suspended')return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=t;o.frequency.setValueAtTime(f,n);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.01,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d)};
const seq=a=>a.forEach(([f,t,d,v,w])=>setTimeout(()=>tone(f,t,d,v),w));
const SFX={place:()=>tone(150,'square',.1),clear:()=>seq([[600,'sine',.1,.2,0],[900,'sine',.2,.2,100]]),
levelUp:()=>seq([[400,'sine',.1,.2,0],[500,'sine',.1,.2,100],[600,'sine',.1,.2,200],[800,'sine',.4,.25,300]]),
gameOver:()=>seq([[300,'sawtooth',.3,.15,0],[250,'sawtooth',.3,.15,300],[200,'sawtooth',.5,.15,600]]),
missileDrop:()=>{if(AC.state==='suspended')return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type='sawtooth';o.frequency.setValueAtTime(800,n);o.frequency.exponentialRampToValueAtTime(100,n+.4);g.gain.setValueAtTime(.2,n);g.gain.exponentialRampToValueAtTime(.01,n+.4);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+.4)},
explosion:()=>tone(50,'square',.5,.3),goblinLaugh:()=>seq([[700,'square',.1,.1,0],[900,'square',.1,.1,100],[1100,'square',.1,.1,200]]),
goblinSteal:()=>tone(400,'triangle',.1),tick:()=>tone(1000,'square',.03,.05)};

/* --- Nature BGM Synthesizer & Soundscape Engine --- */
const NOTES = {
  D2: 73.42, E2: 82.41, Fs2: 92.50, G2: 98.00, A2: 110.00, B2: 123.47,
  C3: 130.81, D3: 146.83, E3: 164.81, Fs3: 185.00, G3: 196.00, A3: 220.00, B3: 246.94,
  C4: 261.63, D4: 293.66, E4: 329.63, Fs4: 369.99, G4: 392.00, A4: 440.00, B4: 493.88,
  C5: 523.25, D5: 587.33, E5: 659.25, Fs5: 739.99, G5: 783.99, A5: 880.00, B5: 987.77,
  C6: 1046.50, D6: 1174.66
};

// 64-step pastoral loop (8 measures in G Major / 86 BPM)
const NATURE_SONG = [
  // Bar 1 (Gmaj7) - Sunshine & Morning Dew
  { b: NOTES.G2, k: [NOTES.G3, NOTES.D4], f: [NOTES.B4, 4] },
  { k: [NOTES.B4] },
  { k: [NOTES.Fs4] },
  { k: [NOTES.D4] },
  { b: NOTES.D3, k: [NOTES.B3, NOTES.G4], f: [NOTES.D5, 2] },
  { k: [NOTES.D5] },
  { k: [NOTES.B4], f: [NOTES.E5, 2] },
  { k: [NOTES.G4] },

  // Bar 2 (Cmaj9) - Blooming Orchard
  { b: NOTES.C3, k: [NOTES.C3, NOTES.G4], f: [NOTES.D5, 6] },
  { k: [NOTES.E4] },
  { k: [NOTES.B4] },
  { k: [NOTES.G4] },
  { b: NOTES.G2, k: [NOTES.C4, NOTES.D5] },
  { k: [NOTES.C5] },
  { k: [NOTES.B4], f: [NOTES.B4, 2] },
  { k: [NOTES.G4] },

  // Bar 3 (Am7) - Gentle River Breeze
  { b: NOTES.A2, k: [NOTES.A3, NOTES.E4], f: [NOTES.C5, 4] },
  { k: [NOTES.C5] },
  { k: [NOTES.G4] },
  { k: [NOTES.E4] },
  { b: NOTES.E3, k: [NOTES.A3, NOTES.A4], f: [NOTES.B4, 2] },
  { k: [NOTES.C5] },
  { k: [NOTES.E5], f: [NOTES.A4, 2] },
  { k: [NOTES.C5] },

  // Bar 4 (D7sus4 -> D7) - Golden Afternoon
  { b: NOTES.D3, k: [NOTES.D3, NOTES.A4], f: [NOTES.A4, 4] },
  { k: [NOTES.G4] },
  { k: [NOTES.D5] },
  { k: [NOTES.A4] },
  { b: NOTES.A2, k: [NOTES.D3, NOTES.Fs4], f: [NOTES.G4, 4] },
  { k: [NOTES.C5] },
  { k: [NOTES.D5] },
  { k: [NOTES.A4] },

  // Bar 5 (Em9) - Green Tree Canopy
  { b: NOTES.E2, k: [NOTES.E3, NOTES.B4], f: [NOTES.G4, 4] },
  { k: [NOTES.G4] },
  { k: [NOTES.Fs5] },
  { k: [NOTES.E5] },
  { b: NOTES.B2, k: [NOTES.E3, NOTES.B4], f: [NOTES.B4, 2] },
  { k: [NOTES.D5] },
  { k: [NOTES.B4], f: [NOTES.D5, 2] },
  { k: [NOTES.G4] },

  // Bar 6 (Bm7) - Peaceful Stream
  { b: NOTES.B2, k: [NOTES.B3, NOTES.Fs4], f: [NOTES.Fs5, 6] },
  { k: [NOTES.D5] },
  { k: [NOTES.A4] },
  { k: [NOTES.Fs4] },
  { b: NOTES.Fs2, k: [NOTES.B3, NOTES.D4] },
  { k: [NOTES.Fs4] },
  { k: [NOTES.A4], f: [NOTES.E5, 2] },
  { k: [NOTES.Fs4] },

  // Bar 7 (Cmaj7) - Harvest Blossoms
  { b: NOTES.C3, k: [NOTES.C3, NOTES.G4], f: [NOTES.E5, 4] },
  { k: [NOTES.E4] },
  { k: [NOTES.B4] },
  { k: [NOTES.G4] },
  { b: NOTES.G2, k: [NOTES.C4, NOTES.C5], f: [NOTES.G5, 2] },
  { k: [NOTES.D5] },
  { k: [NOTES.E5], f: [NOTES.Fs5, 2] },
  { k: [NOTES.G5] },

  // Bar 8 (D7) - Sunset Horizon (resolves back to G)
  { b: NOTES.D3, k: [NOTES.D3, NOTES.Fs4], f: [NOTES.D5, 4] },
  { k: [NOTES.A4] },
  { k: [NOTES.C5] },
  { k: [NOTES.D5] },
  { b: NOTES.D2, k: [NOTES.D3, NOTES.A4], f: [NOTES.B4, 2] },
  { k: [NOTES.Fs4] },
  { k: [NOTES.D4], f: [NOTES.A4, 2] },
  { k: [NOTES.Fs4] }
];

const NatureBGM = {
  running: false,
  muted: false,
  masterGain: null,
  ambienceGain: null,
  breezeSource: null,
  breezeLFO: null,
  schedulerTimer: null,
  birdTimer: null,
  stepIndex: 0,
  nextStepTime: 0,
  tempo: 86,
  stepDuration: 0,

  init() {
    this.stepDuration = (60 / this.tempo) / 2; // eighth note ~0.3488s
    try {
      this.muted = (localStorage.getItem('fruitBlockMusicMuted') === '1');
    } catch (e) {
      this.muted = false;
    }
    this.updateUI();
  },

  setupAudioNodes() {
    if (this.masterGain) return;
    this.masterGain = AC.createGain();
    const targetVol = this.muted ? 0.0001 : 0.42;
    this.masterGain.gain.setValueAtTime(targetVol, AC.currentTime);
    this.masterGain.connect(AC.destination);

    this.ambienceGain = AC.createGain();
    this.ambienceGain.gain.setValueAtTime(0.7, AC.currentTime);
    this.ambienceGain.connect(this.masterGain);

    this.startBreeze();
  },

  startBreeze() {
    try {
      const sampleRate = AC.sampleRate || 44100;
      const buffer = AC.createBuffer(1, sampleRate * 4, sampleRate);
      const data = buffer.getChannelData(0);
      let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
      for (let i = 0; i < data.length; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.045;
        b6 = white * 0.115926;
      }

      this.breezeSource = AC.createBufferSource();
      this.breezeSource.buffer = buffer;
      this.breezeSource.loop = true;

      const filter = AC.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(380, AC.currentTime);
      filter.Q.setValueAtTime(0.75, AC.currentTime);

      this.breezeLFO = AC.createOscillator();
      this.breezeLFO.frequency.setValueAtTime(0.07, AC.currentTime);
      const lfoGain = AC.createGain();
      lfoGain.gain.setValueAtTime(160, AC.currentTime);
      this.breezeLFO.connect(lfoGain);
      lfoGain.connect(filter.frequency);

      const bGain = AC.createGain();
      bGain.gain.setValueAtTime(0.04, AC.currentTime);

      this.breezeSource.connect(filter);
      filter.connect(bGain);
      bGain.connect(this.ambienceGain);

      this.breezeSource.start();
      this.breezeLFO.start();
    } catch (e) {}
  },

  playBirdChirp() {
    if (!this.running || this.muted || AC.state === 'suspended') return;
    try {
      const now = AC.currentTime;
      const chirps = 2 + Math.floor(Math.random() * 3);
      const baseFreq = 3000 + Math.random() * 1200;
      const panVal = (Math.random() * 1.4) - 0.7;

      let panner = null;
      if (AC.createStereoPanner) {
        panner = AC.createStereoPanner();
        panner.pan.setValueAtTime(panVal, now);
        panner.connect(this.ambienceGain);
      }
      const output = panner || this.ambienceGain;

      for (let i = 0; i < chirps; i++) {
        const cTime = now + (i * (0.09 + Math.random() * 0.05));
        const dur = 0.07 + Math.random() * 0.04;
        const osc = AC.createOscillator();
        const gain = AC.createGain();

        osc.type = 'sine';
        const fStart = baseFreq * (0.95 + Math.random() * 0.2);
        const fPeak = fStart * (1.18 + Math.random() * 0.12);
        const fEnd = fStart * (0.85 + Math.random() * 0.1);

        osc.frequency.setValueAtTime(fStart, cTime);
        osc.frequency.linearRampToValueAtTime(fPeak, cTime + dur * 0.4);
        osc.frequency.exponentialRampToValueAtTime(Math.max(200, fEnd), cTime + dur);

        const birdVol = 0.035 + Math.random() * 0.03;
        gain.gain.setValueAtTime(0.0001, cTime);
        gain.gain.linearRampToValueAtTime(birdVol, cTime + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, cTime + dur);

        osc.connect(gain);
        gain.connect(output);

        osc.start(cTime);
        osc.stop(cTime + dur + 0.02);
      }
    } catch (e) {}
  },

  playKalimba(freq, time, dur = 0.9, vol = 0.18, pan = 0) {
    if (!freq || AC.state === 'suspended') return;
    try {
      const osc1 = AC.createOscillator();
      const osc2 = AC.createOscillator();
      const g1 = AC.createGain();
      const g2 = AC.createGain();

      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(freq, time);

      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(freq * 2.756, time);

      let output = this.masterGain;
      if (AC.createStereoPanner && pan !== 0) {
        const p = AC.createStereoPanner();
        p.pan.setValueAtTime(pan, time);
        p.connect(this.masterGain);
        output = p;
      }

      g1.gain.setValueAtTime(0.0001, time);
      g1.gain.linearRampToValueAtTime(vol, time + 0.004);
      g1.gain.exponentialRampToValueAtTime(0.0001, time + dur);

      g2.gain.setValueAtTime(0.0001, time);
      g2.gain.linearRampToValueAtTime(vol * 0.45, time + 0.003);
      g2.gain.exponentialRampToValueAtTime(0.0001, time + 0.12);

      osc1.connect(g1); g1.connect(output);
      osc2.connect(g2); g2.connect(output);

      osc1.start(time); osc2.start(time);
      osc1.stop(time + dur + 0.05); osc2.stop(time + 0.15);
    } catch (e) {}
  },

  playBass(freq, time, dur = 0.75, vol = 0.28) {
    if (!freq || AC.state === 'suspended') return;
    try {
      const osc = AC.createOscillator();
      const filter = AC.createBiquadFilter();
      const gain = AC.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, time);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(260, time);
      filter.Q.setValueAtTime(1.1, time);

      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.linearRampToValueAtTime(vol, time + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);

      osc.connect(filter); filter.connect(gain); gain.connect(this.masterGain);

      osc.start(time); osc.stop(time + dur + 0.05);
    } catch (e) {}
  },

  playFlute(freq, time, dur = 0.65, vol = 0.14) {
    if (!freq || AC.state === 'suspended') return;
    try {
      const osc = AC.createOscillator();
      const vibrato = AC.createOscillator();
      const vibratoGain = AC.createGain();
      const filter = AC.createBiquadFilter();
      const gain = AC.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, time);

      vibrato.frequency.setValueAtTime(5.2, time);
      vibratoGain.gain.setValueAtTime(3.5, time);
      vibrato.connect(vibratoGain);
      vibratoGain.connect(osc.frequency);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1600, time);

      const attack = Math.min(0.08, dur * 0.25);
      const release = Math.min(0.18, dur * 0.35);

      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.linearRampToValueAtTime(vol, time + attack);
      gain.gain.setValueAtTime(vol * 0.85, time + dur - release);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);

      osc.connect(filter); filter.connect(gain); gain.connect(this.masterGain);

      osc.start(time); vibrato.start(time);
      osc.stop(time + dur + 0.05); vibrato.stop(time + dur + 0.05);
    } catch (e) {}
  },

  scheduleStep(stepIdx, time) {
    const step = NATURE_SONG[stepIdx % NATURE_SONG.length];
    if (step.b) this.playBass(step.b, time, this.stepDuration * 1.8, 0.26);
    if (step.k) {
      step.k.forEach((note, idx) => {
        const pan = idx === 0 ? -0.25 : 0.25;
        this.playKalimba(note, time, 0.95, 0.17, pan);
      });
    }
    if (step.f) {
      const dur = step.f[1] * this.stepDuration * 0.92;
      this.playFlute(step.f[0], time, dur, 0.13);
    }
  },

  start() {
    if (AC.state === 'suspended') {
      AC.resume().catch(() => {});
    }
    this.setupAudioNodes();
    if (this.running) return;
    this.running = true;

    this.nextStepTime = AC.currentTime + 0.05;
    this.stepIndex = 0;

    this.schedulerTimer = setInterval(() => {
      if (!this.running || AC.state === 'suspended') return;
      const lookahead = 0.12;
      while (this.nextStepTime < AC.currentTime + lookahead) {
        this.scheduleStep(this.stepIndex, this.nextStepTime);
        this.nextStepTime += this.stepDuration;
        this.stepIndex = (this.stepIndex + 1) % NATURE_SONG.length;
      }
    }, 35);

    const scheduleNextBird = () => {
      const delay = 4000 + Math.random() * 3500;
      this.birdTimer = setTimeout(() => {
        this.playBirdChirp();
        if (this.running) scheduleNextBird();
      }, delay);
    };
    scheduleNextBird();
  },

  setVolume(vol, rampTime = 0.3) {
    if (!this.masterGain || this.muted) return;
    try {
      const now = AC.currentTime;
      this.masterGain.gain.cancelScheduledValues(now);
      this.masterGain.gain.setValueAtTime(this.masterGain.gain.value, now);
      this.masterGain.gain.linearRampToValueAtTime(Math.max(0.0001, vol), now + rampTime);
    } catch (e) {}
  },

  toggle() {
    this.muted = !this.muted;
    try {
      localStorage.setItem('fruitBlockMusicMuted', this.muted ? '1' : '0');
    } catch (e) {}
    this.updateUI();

    if (!this.running) {
      this.start();
    }
    if (this.masterGain) {
      const targetVol = this.muted ? 0.0001 : 0.42;
      this.setVolume(targetVol, 0.2);
    }
  },

  updateUI() {
    const btn = $('music-btn');
    const icon = $('music-icon');
    const text = $('music-text');
    if (!btn) return;
    if (this.muted) {
      btn.classList.add('muted');
      if (icon) icon.innerText = '🔇';
      if (text) text.innerText = 'Musik Mati';
      btn.title = 'Musik Alam Nonaktif (Klik untuk menyalakan)';
    } else {
      btn.classList.remove('muted');
      if (icon) icon.innerText = '🎵';
      if (text) text.innerText = 'Musik Alam';
      btn.title = 'Musik Alam Aktif (Klik untuk mematikan)';
    }
  },

  stop() {
    this.running = false;
    clearInterval(this.schedulerTimer);
    clearTimeout(this.birdTimer);
    if (this.masterGain) {
      try {
        const now = AC.currentTime;
        this.masterGain.gain.cancelScheduledValues(now);
        this.masterGain.gain.linearRampToValueAtTime(0.0001, now + 0.25);
      } catch (e) {}
    }
  }
};

function toggleMusic() {
  if (AC.state === 'suspended') AC.resume();
  NatureBGM.toggle();
}

    }
    blobs.push(`<circle cx="${cx-14}" cy="${cy-16}" r="18" fill="${leafB}" opacity="0.55"/>`);

    // Fruits
    const fruits=[];
    const n=5+Math.floor(rnd()*4);

      fruits.push(`<circle cx="${(x-1).toFixed(1)}" cy="${(y-1.4).toFixed(1)}" r="1.2" fill="rgba(255,255,255,.75)"/>`);
    }

    return `<svg viewBox="0 0 120 180" preserveAspectRatio="xMidYMax meet">
      <!-- ground shadow at tree base -->
      <ellipse cx="60" cy="178" rx="26" ry="4" fill="rgba(30,20,5,.28)"/>
      <!-- TRUNK: reaches all the way to y=180 (bottom of viewBox) -->
      <path d="M60,180 L60,105" stroke="#7a4a22" stroke-width="14" stroke-linecap="round" fill="none"/>
      <path d="M55,180 L55,105" stroke="#a06a35" stroke-width="4" stroke-linecap="round" fill="none" opacity=".6"/>
      <!-- branches splitting from upper trunk -->
      <path d="M60,128 Q46,120 40,105" stroke="#6b3f1a" stroke-width="6" stroke-linecap="round" fill="none"/>
      <path d="M60,120 Q74,112 80,97"  stroke="#6b3f1a" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M60,140 Q50,138 44,132" stroke="#6b3f1a" stroke-width="4" stroke-linecap="round" fill="none"/>
      <!-- foliage on top -->
      ${blobs.join('')}
      ${fruits.join('')}
    </svg>`;
  }

  const treesC=$('g-trees');
  /* ============================================================
     ✅ LAYOUT POHON — semua di `bottom` (0–4vh), tidak ada lagi
     `bot:40` atau `top:-40` yang bikin pohon melayang.
     off negatif = keluar layar, off positif = masuk ke layar.
     ============================================================ */
  const treeLayout=[
    // ===== SISI KIRI (dari luar ke dalam) =====
    {side:'left',  off:-7, bot:0.5, size:200, seed:11, type:'apple'},
    {side:'left',  off: 1, bot:1.5, size:140, seed:22, type:'orange'},

    {side:'right', off:-7, bot:0.5, size:205, seed:44, type:'apple'},

  const palette={
    apple :{leafA:'#4caf50',leafB:'#66bb6a',leafC:'#388e3c',fruit:'#ff4757'},
    orange:{leafA:'#43a047',leafB:'#66bb6a',leafC:'#2e7d32',fruit:'#ff9f1c'},

  treeLayout.forEach(t=>{

  /* ---------- FENCE ---------- */

    fence.innerHTML=`<svg viewBox="0 0 1000 90" preserveAspectRatio="none">

      <rect x="0" y="74" width="1000" height="7" fill="#8a5a2b" rx="2"/>

  buildFence();

  /* ---------- BUSHES ---------- */
  const bushesC=$('g-bushes');

  }

  /* ---------- FLOWERS ---------- */
  const flowersC=$('g-flowers');
  const FLOWERS=['🌻','🌼','🌸','🌷','🌺','🌾'];
  for(let i=0;i<14;i++){
    const f=document.createElement('div');

    f.style.left=(Math.random()*100)+'%';

    f.style.animationDuration=(2+Math.random()*2.5)+'s';
    f.style.animationDelay=(-Math.random()*3)+'s';

  }

  /* ---------- GRASS ---------- */
  const grassC=$('g-grass');
  const bladeCount=Math.min(90,Math.max(50,Math.floor(W()/9)));
  for(let i=0;i<bladeCount;i++){
    const b=document.createElement('div');
    b.className='blade';
    b.style.left=(Math.random()*100)+'%';
    b.style.height=(10+Math.random()*26)+'px';

  /* ---------- POLLEN ---------- */
  const pollenC=$('g-pollen');
  for(let i=0;i<14;i++){

    p.style.left=(Math.random()*100)+'%';
    p.style.top=(Math.random()*80+10)+'%';
    p.style.animationDuration=(9+Math.random()*10)+'s';
    p.style.animationDelay=(-Math.random()*12)+'s';
    pollenC.appendChild(p);
  }

  /* ---------- BUTTERFLY SVG ---------- */
  function butterflySVG(c1,c2){
    return `<svg viewBox="-20 -16 40 32">
      <ellipse class="bwing bl" cx="-9" cy="-2" rx="9" ry="11" fill="${c1}"/>
      <ellipse class="bwing bl" cx="-7" cy="7"  rx="6"  ry="6"  fill="${c2}"/>
      <ellipse class="bwing br" cx="9"  cy="-2" rx="9"  ry="11" fill="${c1}"/>
      <ellipse class="bwing br" cx="7"  cy="7"  rx="6"  ry="6"  fill="${c2}"/>
      <ellipse cx="0" cy="0" rx="1.6" ry="8" fill="#3a2a1a"/>
      <line x1="-1" y1="-8" x2="-4" y2="-13" stroke="#3a2a1a" stroke-width="1"/>

      <circle cx="-4" cy="-13" r=".8" fill="#3a2a1a"/>
      <circle cx="4"  cy="-13" r=".8" fill="#3a2a1a"/>
    </svg>`;
  }
  const BUTTERFLY_COLORS=[
    ['#ff9ad5','#ffc8e6'],
    ['#ffd166','#ffe9a0'],
    ['#8ecae6','#c9eaf5'],
    ['#c39bff','#e0ceff'],
    ['#ff8a5b','#ffc0a3']
  ];

  const animalsC=$('g-animals');
  const butterflies=[];
  const bees=[];
  const BFLY_COUNT=W()<600?2:3;
  for(let i=0;i<BFLY_COUNT;i++){
    const el=document.createElement('div');
    el.className='butterfly';
    const colors=pick(BUTTERFLY_COLORS);
    el.innerHTML=butterflySVG(colors[0],colors[1]);
    el.style.transform=`translate3d(${rand(50,W()-50)}px,${rand(80,H()*0.6)}px,0)`;
    animalsC.appendChild(el);
    butterflies.push({
      el,
      x:rand(50,W()-50),
      y:rand(80,H()*0.6),
      baseY:rand(80,H()*0.6),
      phase:Math.random()*Math.PI*2,
      speed:rand(.35,.75),
      amp:rand(18,55),
      freq:rand(.5,1.2),
      dir:Math.random()<.5?-1:1,
      idleT:0,
      idleTarget:rand(6,14)

  for(let i=0;i<2;i++){
    const el=document.createElement('div');
    el.className='bee';
    el.innerHTML='<span>🐝</span>';
    el.style.transform=`translate3d(${rand(80,W()-80)}px,${rand(100,H()*0.7)}px,0)`;
    animalsC.appendChild(el);
    bees.push({
      el,
      cx:rand(80,W()-80),
      cy:rand(100,H()*0.7),

  const perches=[
    {x:W()*0.12, y:H()-H()*0.14-70, e:'🐦'},
    {x:W()*0.85, y:H()-H()*0.14-72, e:'🐦'},

  perches.forEach(p=>{

  function spawnFlyingBird(){

  if(!reduceMotion)setTimeout(spawnFlyingBird,3000+Math.random()*4000);

  function spawnMouse(){
    const m=document.createElement('div');
    m.className='mouse';
    m.textContent='🐭';
    m.style.bottom=(4+Math.random()*6)+'vh';
    m.style.setProperty('--dur',(11+Math.random()*6)+'s');
    animalsC.appendChild(m);
    const t=(13+Math.random()*8)*1000;
    setTimeout(()=>{m.remove();setTimeout(spawnMouse,4000+Math.random()*9000)},t);
  }
  setTimeout(spawnMouse,2500+Math.random()*3000);

  function spawnRabbit(){
    const r=document.createElement('div');
    r.className='rabbit hop';
    r.textContent='🐰';
    r.style.bottom=(3+Math.random()*4)+'vh';
    r.style.setProperty('--dur',(11+Math.random()*5)+'s');
    animalsC.appendChild(r);
    const t=(12+Math.random()*6)*1000;
    setTimeout(()=>{r.remove();setTimeout(spawnRabbit,8000+Math.random()*10000)},t);
  }
  setTimeout(spawnRabbit,5000+Math.random()*4000);

  /* ---------- ANIMATION LOOP ---------- */
  let running=true,last=performance.now();
  function loop(now){
    if(!running)return;
    const dt=Math.min(50,now-last);last=now;
    const t=now/1000;

    if(!reduceMotion){
      butterflies.forEach(b=>{
        b.idleT+=dt/1000;
        if(b.idleT>b.idleTarget){
          if(Math.random()<.4)b.dir*=-1;
          b.idleTarget=rand(6,14);
          b.idleT=0;
          b.baseY=Math.max(60,Math.min(H()*0.7,b.baseY+rand(-60,60)));
        }
        b.x+=b.dir*b.speed*dt*0.06;
        const wob=Math.sin(t*b.freq+b.phase)*b.amp+Math.sin(t*2.3+b.phase*1.7)*b.amp*0.3;
        b.y=b.baseY+wob;
        if(b.x>W()+40){b.x=-40;b.baseY=rand(80,H()*0.6);b.dir=1}
        if(b.x<-40){b.x=W()+40;b.baseY=rand(80,H()*0.6);b.dir=-1}
        const tilt=Math.sin(t*3+b.phase)*6;
        b.el.style.transform=`translate3d(${b.x.toFixed(1)}px,${b.y.toFixed(1)}px,0) rotate(${tilt.toFixed(1)}deg) scaleX(${b.dir})`;
      });

      bees.forEach(b=>{
        b.t+=dt/1000;
        if(b.t>b.retarget){
          b.cx=rand(80,W()-80);
          b.cy=rand(100,H()*0.7);
          b.r=rand(18,48);
          b.retarget=rand(3,7);
          b.t=0;
        }
        b.phase+=b.speed*dt*0.004;
        const x=b.cx+Math.cos(b.phase)*b.r;
        const y=b.cy+Math.sin(b.phase*1.3)*b.r*0.6;
        b.el.style.transform=`translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0)`;
      });
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){running=false}
    else if(!running){running=true;last=performance.now();requestAnimationFrame(loop)}
  });

  let lastW=W();
  let resizeT=null;
  window.addEventListener('resize',()=>{
    clearTimeout(resizeT);
    resizeT=setTimeout(()=>{
      const nw=W();
      if(Math.abs(nw-lastW)<80)return;
      lastW=nw;
      buildFence();
    },250);
  });
})();

function switchScreen(id){['screen-main','screen-level','screen-game'].forEach(s=>$(s).style.display='none');$(id).style.display='flex';updateBackButton(id)}
function hideOverlays(){['game-over','level-complete','pause'].forEach(k=>$(k+'-overlay').style.display='none')}
function showMainMenu(){if(AC.state==='suspended')AC.resume();switchScreen('screen-main');clearInterval(timer)}
function showLevelMenu(){
  if(AC.state==='suspended')AC.resume();clearInterval(timer);hideOverlays();
  const g=$('level-grid');g.innerHTML='';
  for(let i=1;i<=10;i++){const b=document.createElement('button');b.style.animationDelay=`${i*30}ms`;
    if(i<=unlockedLevel){b.className='lv on';b.innerText=i;b.onclick=()=>initGame(i)}else{b.className='lv off';b.innerText='🔒'}
    g.appendChild(b)}
  switchScreen('screen-level');
}
function quitToMenu(){isPaused=false;$('pause-overlay').style.display='none';showMainMenu()}
function togglePause(){
  if(isGameOver||isAnimating||$('level-complete-overlay').style.display==='flex')return;
  isPaused=!isPaused;
  if(isPaused){
    clearInterval(timer);
    $('pause-overlay').style.display='flex';
    NatureBGM.setVolume(0.12);
  } else {
    $('pause-overlay').style.display='none';
    startTimer(true);
    NatureBGM.setVolume(0.42);
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden && !isGameOver && !isPaused && $('screen-game').classList.contains('active')) {
    togglePause();
  }
});
function nextLevel(){currentLevel<10?initGame(currentLevel+1):showMainMenu()}

function updateBackButton(id){
  const b=$('back-to-world');
  b.style.display=(id==='screen-game')?'flex':'none';
}

function exitToWorld(){
  clearInterval(timer);
  isPaused=false;isAnimating=false;isGameOver=true;
  NatureBGM.stop();
  document.querySelectorAll('.ff,.jc,.boom,.ring,.mis,.zone,.gsp,.cf,.ftx,.fsc').forEach(e=>e.remove());
  window.location.href='main.html?from=kebun';
}

/* ============================================================
   LOGIKA GAME
   ============================================================ */
function initGame(lv){
  if(AC.state==='suspended')AC.resume();
  currentLevel=lv;board=Array(N).fill().map(()=>Array(N).fill(0));score=0;sel=-1;
  isBombMode=isAnimating=isGameOver=isPaused=false;bombCount=goblinCount=MAXP;updatePowerupUI();
  $('score-val').innerText=0;$('level-val').innerText=lv;hideOverlays();$('btn-bomb').classList.remove('act');
  switchScreen('screen-game');createBoardDOM();spawnShapes();updateBoardDisplay();startTimer();
}
function startTimer(res=false){
  clearInterval(timer);if(!res)timeLeft=LEVEL_TIME;updateTimeUI();
  timer=setInterval(()=>{
    if(isGameOver||isPaused)return;
    timeLeft--;updateTimeUI();if(timeLeft<=10&&timeLeft>0)SFX.tick();
    if(timeLeft<=0){clearInterval(timer);triggerGameOver('WAKTU HABIS!')}
  },1000);
}
function updateTimeUI(){$('time-val').innerText=timeLeft;$('time-val').classList.toggle('tw',timeLeft<=10)}
function updatePowerupUI(){
  const b=$('btn-bomb'),g=$('btn-goblin');
  b.innerHTML=`<i>🚀</i><span>Roket</span><em>${bombCount}</em>`;g.innerHTML=`<i>🐀</i><span>Tikus</span><em>${goblinCount}</em>`;
  b.classList.toggle('off',bombCount<=0);g.classList.toggle('off',goblinCount<=0);
  if(bombCount<=0&&isBombMode)toggleBombMode();
}
function addScore(p){
  score+=p;$('score-val').innerText=score;
  try{
    const curMax=parseInt(localStorage.getItem('gamedev_meta_fruit_score')||0);
    if(score>curMax)localStorage.setItem('gamedev_meta_fruit_score',score);
  }catch(e){}
  if(score>=TARGET&&!isGameOver)setTimeout(triggerLevelComplete,500)
}
function triggerLevelComplete(){
  if(isGameOver)return;isGameOver=true;clearInterval(timer);SFX.levelUp();
  try{localStorage.setItem('gamedev_meta_fruit_cleared','1');}catch(e){}
  if(currentLevel<10&&unlockedLevel<=currentLevel){unlockedLevel=currentLevel+1;try{localStorage.setItem('fruitBlockUnlockedLevel',unlockedLevel)}catch(e){}}
  const b=$('btn-next-level');
  if(currentLevel>=10){b.innerText='Tamat! Kembali ke Menu';b.onclick=showMainMenu}else{b.innerText='Level Selanjutnya';b.onclick=nextLevel}
  $('level-complete-overlay').style.display='flex';confetti();
}
function triggerGameOver(reason){isGameOver=true;clearInterval(timer);SFX.gameOver();$('game-over-reason').innerText=reason;$('game-over-overlay').style.display='flex'}

/* ============================================================
   EFEK VISUAL
   ============================================================ */
function mk(cls,css,txt){const e=document.createElement('div');e.className=cls;e.style.cssText=css;if(txt)e.textContent=txt;document.body.appendChild(e);return e}
function showFloatingScore(x,y,p){const e=mk('fsc',`left:${x}px;top:${y}px`,`+${p}`);setTimeout(()=>e.remove(),800)}
function showCombo(n){const e=mk('ftx','',`COMBO x${n}!`);setTimeout(()=>e.remove(),1500)}
function shake(el,a){el.animate([{transform:'none'},{transform:`translate(${-a}px,${a/2}px)`},{transform:`translate(${a}px,${-a/2}px)`},{transform:`translate(${-a/2}px,0)`},{transform:'none'}],{duration:320})}
function fruitEl(rc,col){return mk('ff',`left:${rc.left}px;top:${rc.top}px;width:${rc.width}px;height:${rc.height}px;font-size:${rc.width*.72}px`,FRUIT[col]||'🍎')}
function burst(cx,cy,n,cols,dist){
  for(let i=0;i<n;i++){
    const s=5+Math.random()*7,c=cols[i%cols.length],a=Math.random()*6.283,d=dist*(.4+Math.random()*.8),x=Math.cos(a)*d,y=Math.sin(a)*d-12;
    const p=mk('jc',`left:${cx-s/2}px;top:${cy-s/2}px;width:${s}px;height:${s}px;background:${c};box-shadow:0 0 8px ${c}`);
    p.animate([{transform:'none',opacity:1,easing:'ease-out'},{transform:`translate(${x}px,${y}px)`,opacity:1,offset:.35,easing:'ease-in'},{transform:`translate(${x*1.3}px,${y+60+Math.random()*80}px) scale(.3)`,opacity:0}],{duration:650+Math.random()*350,fill:'forwards'}).onfinish=()=>p.remove();
  }
}
function breakCell(r,c,delay=0,bx,by){
  const col=board[r][c];board[r][c]=0;if(!col)return;
  const rc=cellEl(r,c).getBoundingClientRect(),e=fruitEl(rc,col),cx=rc.left+rc.width/2,cy=rc.top+rc.height/2,blast=bx!==undefined;
  const dx=blast?(cx-bx)*1.5+(Math.random()-.5)*30:(Math.random()-.5)*80,up=blast?-50-Math.random()*60+(cy-by)*.6:-26,rot=(Math.random()-.5)*600,drop=innerHeight-rc.top+90;
  e.animate([{transform:'none',easing:'ease-out'},{transform:`translate(${dx*.4}px,${up}px) scale(1.25) rotate(${rot*.2}deg)`,offset:.16,easing:'cubic-bezier(.5,0,.9,.6)'},{transform:`translate(${dx}px,${drop}px) scale(.8) rotate(${rot}deg)`,opacity:.9}],{duration:900+Math.random()*350,delay,fill:'both'}).onfinish=()=>e.remove();
  setTimeout(()=>burst(cx,cy,4,[JUICE[col]],32),delay);
}
function blastFx(cx,cy,s){
  const b=mk('boom',`left:${cx-s*.7}px;top:${cy-s*.7}px;width:${s*1.4}px;height:${s*1.4}px`),g=mk('ring',`left:${cx-s/2}px;top:${cy-s/2}px;width:${s}px;height:${s}px`);
  b.animate([{transform:'scale(.2)',opacity:1},{transform:'scale(1.3)',opacity:1,offset:.4},{transform:'scale(1.8)',opacity:0}],{duration:600,fill:'forwards'}).onfinish=()=>b.remove();
  g.animate([{transform:'scale(.2)',opacity:.9},{transform:'scale(2)',opacity:0}],{duration:600,easing:'ease-out',fill:'forwards'}).onfinish=()=>g.remove();
  burst(cx,cy,18,['#ffed4a','#ff9f43','#ff4d4d','#fff'],s*.8);
}
function stealFx(rc,col){
  burst(rc.left+rc.width/2,rc.top+rc.height/2,8,['#8ce99a','#ffe066','#fff'],34);
  const e=fruitEl(rc,col);
  e.animate([{transform:'none',opacity:1},{transform:'translateY(-34px) scale(1.4) rotate(-20deg)',opacity:1,offset:.4},{transform:'translateY(-10px) scale(0) rotate(200deg)',opacity:0}],{duration:420,easing:'ease-in-out',fill:'forwards'}).onfinish=()=>e.remove();
}
function confetti(){
  for(let i=0;i<36;i++){
    const e=mk('cf',`left:${Math.random()*100}vw;font-size:${18+Math.random()*18}px`,COLORS.map(c=>FRUIT[c])[i%5]);
    e.animate([{transform:'none'},{transform:`translateY(${innerHeight+80}px) rotate(${(Math.random()-.5)*720}deg)`}],{duration:1800+Math.random()*1400,delay:Math.random()*500,easing:'ease-in',fill:'both'}).onfinish=()=>e.remove();
  }
}

/* ============================================================
   POWER-UP
   ============================================================ */
function toggleBombMode(){
  if(isAnimating||bombCount<=0||isGameOver||isPaused)return;
  isBombMode=!isBombMode;$('btn-bomb').classList.toggle('act',isBombMode);
  if(isBombMode){sel=-1;renderTray()}clearGhost();
}
function fireBomb(sr,sc){
  if(bombCount<=0||isGameOver||isPaused)return;
  isAnimating=true;isBombMode=false;bombCount--;updatePowerupUI();$('btn-bomb').classList.remove('act');clearGhost();
  const er=Math.min(sr+3,N-1),ec=Math.min(sc+3,N-1),a=cellEl(sr,sc).getBoundingClientRect(),b=cellEl(er,ec).getBoundingClientRect();
  const W=b.right-a.left,H=b.bottom-a.top,cx=a.left+W/2,cy=a.top+H/2;
  SFX.missileDrop();
  const z=mk('zone',`left:${a.left}px;top:${a.top}px;width:${W}px;height:${H}px`);
  const m=mk('mis',`left:${cx-20}px;top:-60px`);m.innerHTML='<i></i><span class="rk">🚀</span>';
  m.animate([{transform:'none'},{transform:`translateY(${cy+40}px)`}],{duration:420,easing:'cubic-bezier(.5,0,1,.8)',fill:'forwards'});
  setTimeout(()=>{
    m.remove();z.remove();SFX.explosion();blastFx(cx,cy,Math.max(W,H));
    let n=0;
    for(let r=sr;r<=er;r++)for(let c=sc;c<=ec;c++){if(board[r][c])n++;breakCell(r,c,0,cx,cy)}
    updateBoardDisplay();shake($('screen-game'),8);
    if(n){addScore(n*10);showFloatingScore(cx-20,a.top-10,n*10)}
    setTimeout(()=>{isAnimating=false;checkMovesLeft()},600);
  },420);
}
function summonGoblin(){
  if(isAnimating||goblinCount<=0||isGameOver||isPaused)return;
  const filled=[];for(const r of R8)for(const c of R8)if(board[r][c]!==0)filled.push({r,c});
  if(!filled.length)return;
  goblinCount--;updatePowerupUI();isAnimating=true;SFX.goblinLaugh();
  filled.sort(()=>Math.random()-.5);const targets=filled.slice(0,5);
  const cw=cellEl(0,0).getBoundingClientRect().width;
  const g=mk('gsp',`left:-100px;top:50vh;font-size:${cw*1.15}px`);g.innerHTML='<b class="bub">Hihi, nyam!</b><span class="gb">🐀</span>';
  let px=-100,step=0;
  function next(){
    if(step>=targets.length){
      g.style.transform='rotate(14deg)';g.style.left='120vw';
      setTimeout(()=>{g.remove();isAnimating=false;updateBoardDisplay();checkMovesLeft()},500);return;
    }
    const t=targets[step],cell=cellEl(t.r,t.c),rc=cell.getBoundingClientRect(),nx=rc.left-5;
    g.style.transform=`rotate(${nx>px?12:-12}deg)`;g.style.left=nx+'px';g.style.top=(rc.top-cw*.3)+'px';px=nx;
    setTimeout(()=>{
      SFX.goblinSteal();const col=board[t.r][t.c];board[t.r][t.c]=0;stealFx(rc,col);cell.className='cell';
      addScore(10);showFloatingScore(rc.left+20,rc.top,10);step++;next();
    },350);
  }
  setTimeout(next,100);
}

/* ============================================================
   BOARD
   ============================================================ */
function createBoardDOM(){
  const b=$('board');b.innerHTML='';
  for(const r of R8)for(const c of R8){
    const d=document.createElement('div');d.className='cell';d.id=`cell-${r}-${c}`;
    d.onmouseenter=()=>{if(isBombMode&&!isPaused)drawGhost(r,c)};
    d.onmouseleave=()=>{if(isBombMode&&!isPaused)clearGhost()};
    d.onclick=()=>{if(!isPaused&&!isAnimating&&!isGameOver&&isBombMode)fireBomb(r,c)};
    b.appendChild(d);
  }
}
function updateBoardDisplay(){
  for(const r of R8)for(const c of R8){const e=cellEl(r,c);e.className='cell';if(board[r][c]!==0)e.classList.add('filled',board[r][c])}
}
function nearestCell(x,y){
  let best=null,min=1e9;
  for(const r of R8)for(const c of R8){
    const k=cellEl(r,c).getBoundingClientRect(),d=Math.hypot((x-k.left-k.width/2)/Math.max(k.width,1),(y-k.top-k.height/2)/Math.max(k.height,1));
    if(d<min){min=d;best={r,c}}
  }
  return min<=.95?best:null;
}
function drawGhost(sr,sc){
  clearGhost();if(isAnimating||isGameOver||isPaused)return;
  if(isBombMode){for(let r=sr;r<=Math.min(sr+3,N-1);r++)for(let c=sc;c<=Math.min(sc+3,N-1);c++)cellEl(r,c).classList.add('bt');return}
  const so=trayShapes[sel];if(!so)return;const ok=canPlace(so,sr,sc);
  so.matrix.forEach((row,r)=>row.forEach((v,c)=>{
    const rr=sr+r,cc=sc+c;if(v!==1||rr<0||rr>=N||cc<0||cc>=N)return;
    cellEl(rr,cc).classList.add(...(ok?['gh',so.color]:['bad']));
  }));
}
function clearGhost(){
  document.querySelectorAll('.gh').forEach(e=>e.classList.remove('gh',...COLORS));
  document.querySelectorAll('.bad,.bt').forEach(e=>e.classList.remove('bad','bt'));
}
function canPlace(so,sr,sc){
  if(!so)return false;
  for(let r=0;r<so.matrix.length;r++)for(let c=0;c<so.matrix[r].length;c++)if(so.matrix[r][c]===1){
    const rr=sr+r,cc=sc+c;if(rr<0||rr>=N||cc<0||cc>=N||board[rr][cc]!==0)return false;
  }
  return true;
}
function placeShape(sr,sc){
  const so=trayShapes[sel];if(!so||!canPlace(so,sr,sc))return;
  SFX.place();so.matrix.forEach((row,r)=>row.forEach((v,c)=>{if(v===1)board[sr+r][sc+c]=so.color}));
  trayShapes[sel]=null;sel=-1;clearGhost();updateBoardDisplay();setTimeout(checkLines,50);renderTray();
}
function spawnShapes(){
  trayShapes=[];
  for(let i=0;i<3;i++)trayShapes.push({matrix:SHAPES[Math.floor(Math.random()*SHAPES.length)],color:COLORS[Math.floor(Math.random()*COLORS.length)]});
  renderTray();checkMovesLeft();
}
function renderTray(){
  const t=$('tray');t.innerHTML='';
  trayShapes.forEach((so,i)=>{
    if(!so){const s=document.createElement('div');s.style.cssText='width:20vw;max-width:80px';t.appendChild(s);return}
    const d=document.createElement('div');d.className='sc';
    d.style.gridTemplateColumns=`repeat(${so.matrix[0].length},var(--tc))`;d.style.gridTemplateRows=`repeat(${so.matrix.length},var(--tc))`;
    d.addEventListener('pointerdown',e=>startDrag(e,i,d));
    so.matrix.forEach((row,r)=>row.forEach((v,c)=>{
      const b=document.createElement('div');b.className='sx';b.dataset.r=r;b.dataset.c=c;
      b.classList.add(...(v===1?['filled',so.color]:['empty']));d.appendChild(b);
    }));
    t.appendChild(d);
  });
}

/* ============================================================
   DRAG & DROP
   ============================================================ */
function startDrag(e,i,el){
  if(isAnimating||isGameOver||isPaused||trayShapes[i]===null)return;
  e.preventDefault();if(isBombMode)toggleBombMode();if(AC.state==='suspended')AC.resume();
  isDragging=true;sel=i;lpX=e.clientX;lpY=e.clientY;vY=e.pointerType==='touch'?78:18;
  const t=e.target.closest('.sx');
  if(t&&t.classList.contains('filled')){
    tR=+t.dataset.r;tC=+t.dataset.c;
    const er=el.getBoundingClientRect(),tr=t.getBoundingClientRect();
    cX=tr.left-er.left;cY=tr.top-er.top;gX=e.clientX-tr.left;gY=e.clientY-tr.top;
  }else{tR=tC=0;cX=cY=0;gX=gY=12}
  ghostEl=el.cloneNode(true);ghostEl.classList.add('dragging');document.body.appendChild(ghostEl);el.style.opacity='.3';
  moveDrag(e.clientX,e.clientY);
}
function moveDrag(x,y){
  if(!isDragging||!ghostEl)return;lpX=x;lpY=y;
  ghostEl.style.left=`${x-cX-gX}px`;ghostEl.style.top=`${y-cY-gY-vY}px`;
  const n=nearestCell(x-gX,y-gY-vY);
  if(!n){if(hover){hover=null;clearGhost()}return}
  const sr=n.r-tR,sc=n.c-tC,k=`${sr}|${sc}`;
  if(!hover||hover.k!==k){hover={sr,sc,k};drawGhost(sr,sc)}
}
function stopDrag(){
  if(!isDragging)return;moveDrag(lpX,lpY);
  if(hover&&sel!==-1&&canPlace(trayShapes[sel],hover.sr,hover.sc))placeShape(hover.sr,hover.sc);
  const oi=sel;if(ghostEl){ghostEl.remove();ghostEl=null}
  isDragging=false;hover=null;sel=-1;clearGhost();
  document.querySelectorAll('.sc').forEach(e=>e.style.opacity='');
  if(oi!==-1&&trayShapes[oi]&&!isGameOver)renderTray();
}
document.addEventListener('pointermove',e=>{if(isDragging&&!isPaused){e.preventDefault();moveDrag(e.clientX,e.clientY)}},{passive:false});
document.addEventListener('pointerup',stopDrag);document.addEventListener('pointercancel',stopDrag);

/* ============================================================
   CEK BARIS / LANGKAH
   ============================================================ */
function checkLines(){
  const rows=R8.filter(r=>board[r].every(v=>v!==0)),cols=R8.filter(c=>board.every(row=>row[c]!==0)),cells=new Set();
  rows.forEach(r=>R8.forEach(c=>cells.add(r*N+c)));cols.forEach(c=>R8.forEach(r=>cells.add(r*N+c)));
  if(!cells.size)return checkMovesLeft();
  SFX.clear();
  cells.forEach(k=>{const r=Math.floor(k/N);breakCell(r,k%N,(N-1-r)*28)});
  const lines=rows.length+cols.length,pts=lines*100+cells.size*10;
  addScore(pts);updateBoardDisplay();
  const br=$('board').getBoundingClientRect();
  showFloatingScore(br.left+br.width/2-20,br.top+br.height/2,pts);
  if(lines>1)showCombo(lines);
  shake($('board'),3+lines*2);
  setTimeout(checkMovesLeft,400);
}
function checkMovesLeft(){
  if(isGameOver)return;
  if(!trayShapes.some(s=>s!==null)){spawnShapes();return}
  const can=trayShapes.some(so=>so&&R8.some(r=>R8.some(c=>canPlace(so,r,c))));
  if(!can)triggerGameOver('Tidak Ada Langkah Lagi!');
}

updateBackButton('screen-main');
NatureBGM.init();

const handleFirstAudioGesture = () => {
  if (AC.state === 'suspended') AC.resume();
  NatureBGM.start();
};
['pointerdown', 'keydown', 'touchstart'].forEach(evt => {
  window.addEventListener(evt, handleFirstAudioGesture, { once: true });
});
</script></body></html>
